settings:
  threshold: 75              # min relevance_score (0-100) to shortlist a job
  concurrency: 4             # parallel LLM calls
  provider: claude_code      # claude_code (your Claude subscription) / openai / anthropic / gemini
  model: claude-sonnet-5     # model name for the chosen provider
  effort: medium             # thinking level for claude_code: low / medium / high / xhigh / max
  request_interval_s: 0      # seconds between requests; raise if you hit rate limits
  claude_cli_timeout_s: 600  # per-call bound for the claude_code provider
  max_content_chars: 8000    # truncate the job description to this length before sending
  skip_llm: false            # true = shortlist everything that passes the funnel, no scoring

  # Set by /hireshire:setup. resume_path is your PDF; search_profile_path is the
  # generated "ideal candidate" profile used ONLY as the reranker query — it is
  # never shown to the scorer, which must judge against the real resume.
  resume_path: ""
  search_profile_path: profile.md

# Title keywords, generated from your resume by /hireshire:setup.
# Shipped empty on purpose: inheriting someone else's keywords would quietly
# restrict your search to their field.
title_filter:
  # Title must contain at least one of these (case-insensitive). Empty = no include check.
  include_keywords: []
  # Title must contain none of these.
  exclude_keywords: []

# The funnel decides which jobs are worth an LLM call.
#
#   1. exclude keywords     free, drops the hard no's
#   2. include fast-pass    free, keeps obvious hits
#   3. encoder              cheap semantic check on the TITLE — a recall net
#   4. detail hydration     fetches descriptions for surviving list-only jobs
#   5. rerank + top_k       cross-encoder over the full description; only the
#                           best `top_k` are scored by the LLM
#
# Stages 1-3 see only the title, which is all that exists for Workday/BambooHR
# before hydration. Real precision comes from the reranker in stage 5, so keep the
# encoder threshold low: raising it throws away exactly the differently-worded
# jobs the reranker exists to catch.
funnel:
  enabled: true
  encoder:
    model: sentence-transformers/all-MiniLM-L6-v2
    # Adjacent job titles you are qualified for, generated at setup.
    targets: []
    threshold: 0.25   # recall net — deliberately loose
  # Two-stage cross-encoder cascade over the full job descriptions.
  #
  # Stage 1 (`model`) is cheap enough to read every surviving description. Stage 2
  # (`refine`) is 3x slower but materially more accurate, so it only reads the few
  # hundred that could still win the budget.
  #
  # The two stages emit DIFFERENT LOGIT SCALES. Their scores are never compared or
  # combined — the ranking puts every refined job above every unrefined one, which
  # is why `refine.depth` must stay >= top_k (enforced at config load).
  #
  # These are Ettin models: ModernBERT-based, 8192-token window, Apache 2.0. The
  # previous ms-marco-MiniLM capped at 512 tokens and truncated 41% of descriptions
  # before their requirements section, which made its ranking near-random.
  # COST, measured on a 16-core CPU over a real 7,021-job sweep: stage 1 ~32 min,
  # stage 2 ~9 min at depth 500. That is deliberate — no truncation anywhere — but
  # it roughly triples a ~20 min sweep. `max_doc_chars` is the dial if that is too
  # slow, and it is far cheaper than it looks to turn down: at 4,000 chars stage 1
  # drops to ~12 min and still includes the requirements section for 96.9% of
  # postings (3,000 -> ~9.5 min / 92.9%; 2,000 -> ~6.8 min / 82.0%). For reference
  # the old broken 1,200 setting reached only 56.8%. Stage 1 only has to be right
  # at depth `refine.depth`, not at top_k, so it tolerates truncation the final
  # scorer never could. Batch size makes no measurable difference; do not bother.
  rerank:
    enabled: true
    model: cross-encoder/ettin-reranker-17m-v1
    # ~2,960 tokens at the measured 5.06 chars/token. Covers 99.8% of real
    # postings in full; the longest ever measured was 25,386 chars / 2,693 tokens,
    # so the 8192 window is never the limit — this is a cost dial. Cost flattens
    # above ~10,000 chars because the mean posting is only 6,232, so the last
    # 5,000 chars of headroom are close to free.
    max_doc_chars: 15000
    max_length: 4096      # safety bound on the pair; never binds in practice
    batch_size: 16
    refine:
      enabled: true
      model: cross-encoder/ettin-reranker-68m-v1
      depth: 500          # how many of stage 1's best get re-scored. Must be >= top_k.
      batch_size: 8

  # Repeat postings of one requisition share a single LLM call, and the score is
  # copied to every copy — nothing is discarded. One employer's job once took 31 of
  # 100 budget slots. Jobs group only when the company AND the normalised title
  # match, so several different roles at one employer stay independently eligible.
  dedupe:
    enabled: true

  detail_fetch:
    concurrency: 10
    jitter_s: 0.3
    timeout_s: 20

  # How many jobs get an LLM score per run — your budget, and what makes this
  # affordable at scale. On a Claude subscription the real limit is prompts per
  # 5-hour window, so a few hundred is the practical ceiling. 0 = no cap.
  # Jobs that miss the cut are recorded as `rerank_below_top_k` and stay eligible
  # for the next run, so raising this later recovers them.
  top_k: 100
