settings:
  threshold: 75              # min relevance_score (0-100) to shortlist a job
  concurrency: 4             # parallel LLM calls
  provider: claude_code      # claude_code (your Claude subscription) / openai / anthropic / gemini
  # Sonnet, not Haiku, and the reason is not only accuracy: `effort` below is
  # unsupported on Haiku and degrades silently, falling back to the highest level the
  # model does support. Switching to Haiku would leave you with a thinking dial that
  # does nothing. It also has a much larger minimum cacheable prefix, which would
  # stop your resume being cached between jobs and make every call pay full price.
  model: claude-sonnet-5     # model name for the chosen provider
  # Thinking level: low / medium / high / xhigh / max. Thinking tokens bill as
  # output, and once your resume is cached they are most of what a sweep costs — so
  # this is the main dial on how much of your Claude allowance a run consumes.
  # Raise it if matches look shallow; measure a small run first (set top_k low).
  effort: medium
  request_interval_s: 0      # seconds between requests; raise if you hit rate limits
  claude_cli_timeout_s: 600  # per-call bound for the claude_code provider
  max_content_chars: 8000    # truncate the job description to this length before sending
  skip_llm: false            # true = shortlist everything that passes the funnel, no scoring

  # Set by /hireshire:setup. resume_path is your PDF; search_profile_path is the
  # generated "ideal candidate" profile used ONLY as the reranker query — it is
  # never shown to the scorer, which must judge against the real resume.
  resume_path: ""
  search_profile_path: profile.md

# Title keywords, generated from your resume by /hireshire:setup.
# Shipped empty on purpose: inheriting someone else's keywords would quietly
# restrict your search to their field.
title_filter:
  # Title must contain at least one of these (case-insensitive). Empty = no include check.
  include_keywords: []
  # Title must contain none of these.
  exclude_keywords: []

# The funnel decides which jobs are worth an LLM call.
#
#   1. exclude keywords     free, drops the hard no's
#   2. include fast-pass    free, keeps obvious hits
#   3. encoder              cheap semantic check on the TITLE — a recall net
#   4. detail hydration     fetches descriptions for surviving list-only jobs
#   5. rerank               cross-encoder over the full description; only jobs
#                           reaching `rerank.min_score` are scored by the LLM
#
# Every stage is a yes/no about one job, which is what lets a job be scraped and
# shortlisted without waiting for the sweep to end.
#
# Stages 1-3 see only the title, which is all that exists for Workday/BambooHR
# before hydration. Real precision comes from the reranker in stage 5, so keep the
# encoder threshold low: raising it throws away exactly the differently-worded
# jobs the reranker exists to catch, and it saves you nothing — every stage here
# runs on your own machine. Only `rerank.min_score` decides what costs money.
funnel:
  enabled: true
  encoder:
    model: sentence-transformers/all-MiniLM-L6-v2
    # Adjacent job titles you are qualified for, generated at setup.
    targets: []
    threshold: 0.25   # recall net — deliberately loose
  # One cross-encoder, reading every surviving description in full.
  #
  # This used to be a two-model cascade — a cheap model read everything, an accurate
  # one re-read the best few hundred — which existed only to make a global top-K
  # affordable. Selection is a per-job cutoff now, so the cheap pass had nothing to
  # shortlist for, and removing it also removed a real hazard: the two models emitted
  # different logit scales that were meaningless to compare.
  #
  # An Ettin model: ModernBERT-based, 8192-token window, Apache 2.0. The previous
  # ms-marco-MiniLM capped at 512 tokens and truncated 41% of descriptions before
  # their requirements section, which made its ranking near-random.
  #
  # COST, measured on a 16-core CPU over a real 7,021-job sweep: ~9 min for 500
  # documents, so reading everything is the expensive part of a run. It is spread
  # across the sweep rather than run in one block at the end, which hides most of it
  # behind the ~20 min the scrape spends rate-limited. `max_doc_chars` is the dial if
  # it is still too slow, and it is cheaper to turn down than it looks: at 4,000
  # chars you still capture the requirements section of 96.9% of postings (3,000 ->
  # 92.9%; 2,000 -> 82.0%). The old broken 1,200 setting reached only 56.8%. Batch
  # size makes no measurable difference; do not bother.
  rerank:
    enabled: true
    model: cross-encoder/ettin-reranker-68m-v1
    # THE CUTOFF, and the one number here that is personal to you. It is a raw logit
    # against your own search profile — not a percentage, not comparable to anyone
    # else's, and meaningless if you change `model`. Raise it for fewer, better-
    # matched jobs; lower it if runs come back empty. Derive it from a real run with
    # `python scripts/calibrate_cutoffs.py` rather than guessing.
    #
    # 0.0 is the decision boundary these models are trained toward, which makes it a
    # defensible starting point on a fresh install with no history to learn from.
    min_score: 0.0
    # ~2,960 tokens at the measured 5.06 chars/token. Covers 99.8% of real
    # postings in full; the longest ever measured was 25,386 chars / 2,693 tokens,
    # so the 8192 window is never the limit — this is a cost dial. Cost flattens
    # above ~10,000 chars because the mean posting is only 6,232, so the last
    # 5,000 chars of headroom are close to free.
    max_doc_chars: 15000
    max_length: 4096      # safety bound on the pair; never binds in practice
    batch_size: 8

  # Repeat postings of one requisition share a single LLM call, and the score is
  # copied to every copy — nothing is discarded. One employer's job once took 31 of
  # 100 budget slots. Jobs group only when the company AND the job description
  # match, so several different roles at one employer stay independently eligible.
  # Titles are never compared: employers rewrite them freely, and grouping on them
  # merged unrelated jobs (a Starlink role with a Starship one) two times in three.
  dedupe:
    enabled: true
    # Words two descriptions may differ by and still count as one posting. A
    # substitution costs 2 (one word out, one in). Employers interpolate pay bands
    # and addresses per market, so 0 would split copies of one requisition; much
    # above 10 starts absorbing genuinely different postings.
    max_word_diff: 10

  detail_fetch:
    concurrency: 10
    jitter_s: 0.3
    timeout_s: 20

  # The maximum LLM calls one run may make — a SAFETY FUSE, not how jobs are
  # chosen. `rerank.min_score` above decides that; this only stops a badly-set
  # cutoff from handing the judge thousands of jobs before you notice.
  #
  # On a Claude subscription these calls draw on the same allowance as your own
  # Claude chat — a rolling 5-hour window plus a weekly one — so a few hundred is the
  # practical ceiling. 0 = no cap. Jobs that arrive after the cap is reached are
  # recorded as `llm_call_cap_reached` and stay eligible for the next run, so raising
  # this later recovers them. Jobs below the cutoff do not: that was a verdict, and
  # it would come out the same way every time.
  top_k: 150
