settings:
  # The applier submits REAL applications to real employers, unattended. This is the
  # only gate, and /hireshire:setup leaves it in the safe position.
  #
  # There is deliberately no rehearsal mode. `dry_run` used to fill every form and
  # stop short of submitting, which read as a safety net and was not one: the run it
  # rehearsed was not the run that followed, and leaving it on indefinitely produced
  # a plugin that looked like it was working and never applied to anything. On or
  # off is the honest choice.
  enable_applier: false   # true = fills and SUBMITS applications, with no further prompt

  db_path: hireshire.db   # shared SQLite datastore — reads shortlisted matches, writes `applied`
  applied_dir: applied    # on-disk home for screenshots/ (records go to the applied table)
  resume_path: ""         # your resume PDF, set by /hireshire:setup
  inter_job_delay_s: 10   # seconds to wait between applications

  # Career portals that require an account login before showing the form. The
  # applier cannot get past those, so skip them rather than burn a browser
  # session — apply to these manually.
  exclude_companies: [google, apple, meta, microsoft, intuit]

  # Your details — used to fill standard application fields. Set at setup.
  first_name: ""
  last_name: ""
  email: ""
  phone: ""

  generate_cover_letter: false
