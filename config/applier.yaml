settings:
  # The applier submits REAL applications to real employers, unattended. This is the
  # only gate, and /hireshire:setup leaves it in the safe position.
  #
  # There is deliberately no rehearsal mode. `dry_run` used to fill every form and
  # stop short of submitting, which read as a safety net and was not one: the run it
  # rehearsed was not the run that followed, and leaving it on indefinitely produced
  # a plugin that looked like it was working and never applied to anything. On or
  # off is the honest choice.
  enable_applier: false   # true = fills and SUBMITS applications, with no further prompt

  db_path: hireshire.db   # shared SQLite datastore — reads shortlisted matches, writes `applied`
  # Screenshots go to `applied/` inside the run's own results folder; the records go
  # to the `applied` table. Neither is configurable.
  resume_path: ""         # your resume PDF, set by /hireshire:setup
  inter_job_delay_s: 10   # seconds to wait between applications
  apply_timeout_s: 900    # give up on one application after this long (recorded as an error to check)
  backlog_hours: 72       # each sweep also applies to jobs shortlisted this recently but never applied to
  max_per_company: 2      # at most this many applications to one company...
  company_window_hours: 72  # ...in this many hours; later jobs wait for a slot (0 = no cap)

  # Career portals that require an account login before showing the form. The
  # applier cannot get past those, so skip them rather than burn a browser
  # session — apply to these manually.
  exclude_companies: [google, apple, meta, microsoft, intuit, amazon]

  # Your details — used to fill standard application fields. Set at setup.
  first_name: ""
  last_name: ""
  email: ""
  phone: ""
  linkedin_url: ""        # read off your resume at setup; empty if it has none
  github_url: ""          # GitHub profile, likewise
  portfolio_url: ""       # personal site or portfolio, likewise
  postal_code: ""         # ZIP / postal code, asked at setup
  # Every degree, read off your resume and confirmed at setup. One entry each:
  #   - {school: "...", degree: "B.S.", field: "Computer Science", graduation: "2024-05"}
  # graduation is YYYY-MM; a future month means the degree is still expected.
  education: []

  # Screening questions your resume cannot answer, asked once at setup.
  # Empty means never asked: authorization then defaults to yes and sponsorship to no.
  work_authorized:        # authorized to work where you are applying
  requires_sponsorship:   # need visa sponsorship now or in future
  willing_to_relocate:    # open to relocating for the role

  # Voluntary self-identification (US EEO questions), asked once at setup. Used only
  # to fill that section of a form; never read by scoring. Empty means the applier
  # declines to self-identify.
  gender: ""              # male | female | non_binary | decline
  race_ethnicity: ""      # american_indian_alaska_native | asian | black | hispanic_latino | native_hawaiian_pacific_islander | white | two_or_more | decline
  disability: ""          # yes | no | decline
  veteran_status: ""      # protected_veteran | not_protected_veteran | decline

  generate_cover_letter: false
